<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The bone canvas, so a mobile browser's chrome continues the page instead of
         capping it with a band of another colour. Matches the apps. -->
    <meta name="theme-color" content="#f2ead9" />

    <title>BiteSite — order ahead from your college canteen</title>
    <meta
      name="description"
      content="BiteSite lets students order from their college canteen ahead of time, pay online, and collect at the counter without queueing."
    />

    <!-- The real mark, the same file the apps and the PWA ship. -->
    <link rel="icon" type="image/png" href="/brand/logo-mark.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Archivo is self-hosted (see @font-face in src/styles/base.css), so there is
         nothing left to preconnect to. Only the two `latin` faces are preloaded: the
         latin-ext files are behind a unicode-range and are fetched only when an accented
         character actually appears, so preloading them would download bytes most visits
         never use. `crossorigin` is required even same-origin — fonts are fetched in CORS
         mode, and a preload whose mode does not match the real request is downloaded
         twice rather than reused. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="/fonts/archivo-400-700-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="/fonts/archivo-black-400-latin.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
